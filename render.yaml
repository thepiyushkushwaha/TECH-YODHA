# Render Blueprint Infrastructure-as-Code for DRISHTI Full-Stack Application
services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: drishti-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: drishti-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434
      - key: OLLAMA_MODEL
        value: llama3

  # 2. React + Vite Frontend Static Site
  - type: web
    name: drishti-frontend
    env: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: drishti-backend
          property: url
          suffix: /api/v1

databases:
  # 3. PostgreSQL Database (Free Tier)
  - name: drishti-db
    plan: free
    databaseName: drishti_db
    user: drishti_user
